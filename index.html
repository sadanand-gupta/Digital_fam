<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f2e8" />
    <meta
      name="description"
      content="Enjoyed your meal at Chickato Crispy Fried Chicken MMDA, Arumbakkam? Pick a review, copy it in a tap, and post it on Google Maps in seconds."
    />
    <title>Chickato Crispy Fried Chicken MMDA — Leave a review</title>
    <!--
      Fonts are linked here, not @import-ed from style.css. An @import inside
      the stylesheet is serial: the browser must fetch and parse the CSS bundle
      before it even discovers the font request. From here both start together.

      Playfair carries only the wordmark and headings, at 600 and 700 — the
      italic and the 500 the old request asked for were never used by any rule.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Instrument+Sans:wght@400;500;600&display=swap"
    />
    <script>
      // Resolve the theme before first paint, so a returning dark-mode visitor
      // never sees a frame of ivory. Mirrors SiteHeader's logic.
      (function () {
        var saved = null
        try { saved = localStorage.getItem('df-theme') } catch (e) { /* private mode */ }
        var dark = saved
          ? saved === 'dark'
          : window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
